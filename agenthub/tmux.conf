# agenthub 每个 session 只有一个 CLI；tmux 仅负责托管与重连，不暴露复用器 UI。
set-option -g status off
set-option -g mouse off
set-option -g prefix None
set-option -g prefix2 None
# 独立 systemd unit 以前台模式持有 server；没有 session 时也保持 socket 可用。
set-option -s exit-empty off

# 减少 Esc 延迟，并完整传递现代终端的焦点、修饰键与真彩色能力。
set-option -s escape-time 10
set-option -s focus-events on
set-option -s extended-keys on
set-option -g default-terminal "tmux-256color"
set-option -s -u terminal-features
set-option -as terminal-features ",xterm*:RGB"

# 外层 xterm 使用自己的滚动缓冲；tmux attach 不切换外层 alternate screen。
set-option -s -u terminal-overrides
set-option -as terminal-overrides ",xterm*:smcup@:rmcup@"

# 单窗口单 pane：关闭改名、通知和其他会改变界面或截获交互的功能。
set-window-option -g automatic-rename off
set-window-option -g allow-rename off
set-window-option -g monitor-activity off
set-window-option -g synchronize-panes off
set-window-option -g remain-on-exit off
set-window-option -g allow-passthrough on
set-option -g activity-action none
set-option -g bell-action none
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g history-limit 10000
