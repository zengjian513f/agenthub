# Replace the old /agenthub/ location inside the authenticated HTTPS server.
# Keep any legacy per-machine locations during rollout.
location = /agenthub { return 301 /agenthub/; }

location /agenthub/ {
    include snippets/auth.conf;
    proxy_pass http://127.0.0.1:8720/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 512m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-store" always;
}
