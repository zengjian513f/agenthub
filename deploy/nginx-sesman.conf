# Insert inside the example.com HTTPS server block.
location = /sesman { return 301 /sesman/; }

location /sesman/ {
    include snippets/auth.conf;

    proxy_pass http://10.0.0.2:8710/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sesman;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # sesman 自身会压缩大 JSON；这里也为静态文本及未压缩响应提供兜底。
    # WebSocket 和 SSE 不在这些 MIME 类型中，不增加交互延迟。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header Cache-Control "no-store" always;
}
